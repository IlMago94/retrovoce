<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd84d">
<title>Retrovoce</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<header>
  <h1 class="logo" aria-label="Retrovoce">Retro<span class="mirror">voce</span></h1>
  <button id="lang" class="lang" type="button" data-i18n="lang" data-i18n-label="langLabel"></button>
</header>
<main>
  <section class="stage">
    <button id="rec" class="rec" type="button" aria-pressed="false">
      <span class="dot" aria-hidden="true"></span><span id="rec-label"></span>
    </button>
    <p id="timer" class="timer" aria-hidden="true">0:00</p>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>
  <section id="clip" class="clip" hidden>
    <canvas id="wave" aria-hidden="true"></canvas>
    <div class="plays">
      <button id="play-original" class="play" type="button" aria-pressed="false" data-i18n="original"></button>
      <button id="play-reversed" class="play play-rev" type="button" aria-pressed="false" data-i18n="reversed"></button>
    </div>
    <label class="speed">
      <span data-i18n="speed"></span>
      <input id="speed" type="range" step="0.05">
      <output id="speed-out"></output>
    </label>
    <div class="actions">
      <a id="download" class="action" download="retrovoce.wav" data-i18n="download"></a>
      <button id="share" class="action" type="button" data-i18n="share" hidden></button>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</html>
